<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - Rohans Web</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/api.js"></script>
<style>
.section { background:rgba(255,255,255,.5); backdrop-filter:blur(15px); border:1px solid rgba(255,140,0,.2); border-radius:20px; padding:24px; margin-bottom:24px; }
.section h2 { color:#ff8c00; margin-bottom:16px; font-size:1.4rem; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.form-row .form-group { flex:1; min-width:130px; }
.product-checks { display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.product-checks label { display:flex; align-items:center; gap:8px; font-size:.9rem; color:#4a3206; cursor:pointer; }
/* Stats */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card { background:rgba(255,255,255,.6); backdrop-filter:blur(15px); border:1px solid rgba(255,140,0,.2); border-radius:16px; padding:16px; text-align:center; }
.stat-card .stat-num { font-size:2rem; font-weight:bold; color:#ff8c00; display:block; }
.stat-card .stat-label { font-size:.8rem; color:#7a5c1a; text-transform:capitalize; }
/* Student card */
.student-card { background:rgba(255,255,255,.6); border:1px solid rgba(255,140,0,.2); border-radius:14px; padding:14px; margin-bottom:10px; }
.student-card-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
.student-name { font-weight:bold; color:#4a3206; font-size:1rem; }
.student-meta { font-size:.8rem; color:#7a5c1a; margin-top:2px; }
.student-products { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.prod-badge { font-size:.7rem; padding:3px 10px; border-radius:12px; cursor:pointer; transition:.2s; user-select:none; }
.prod-badge.on { background:rgba(39,174,96,.2); color:#27ae60; border:1px solid rgba(39,174,96,.3); }
.prod-badge.off { background:rgba(0,0,0,.05); color:#999; border:1px solid rgba(0,0,0,.1); }
.prod-badge:hover { transform:scale(1.05); }
.student-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.mini-btn { padding:5px 10px; font-size:.75rem; border:1px solid rgba(255,140,0,.2); border-radius:8px; background:rgba(255,255,255,.7); cursor:pointer; color:#4a3206; font-weight:bold; transition:.2s; }
.mini-btn:hover { background:#fff; border-color:#ff8c00; }
.mini-btn.danger { color:#e74c3c; border-color:rgba(231,76,60,.2); }
.mini-btn.danger:hover { background:rgba(231,76,60,.1); }
/* Filter */
.filter-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.filter-row input, .filter-row select { padding:10px 14px; border:2px solid rgba(255,140,0,.2); border-radius:10px; background:rgba(255,255,255,.7); font-size:.9rem; color:#4a3206; outline:none; }
.filter-row input { flex:1; min-width:150px; }
.filter-row input:focus, .filter-row select:focus { border-color:#ff8c00; }
/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:20px; padding:28px; max-width:450px; width:100%; max-height:85vh; overflow:auto; }
.modal h2 { color:#ff8c00; margin-bottom:16px; }
.back-link { margin-bottom:20px; }
.back-link a { color:#7a5c1a; text-decoration:none; font-size:.9rem; }
.sub-header { color:#ff8c00; margin:24px 0 10px; font-size:1.1rem; }
/* All users (super admin) */
.user-card { background:rgba(255,255,255,.6); border:1px solid rgba(255,140,0,.15); border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
.user-card .user-name { font-weight:bold; color:#4a3206; }
.user-card .user-role { font-size:.75rem; padding:2px 8px; border-radius:10px; text-transform:capitalize; }
.user-card .user-role.admin { background:rgba(255,140,0,.15); color:#ff8c00; }
.user-card .user-role.user { background:rgba(52,152,219,.15); color:#3498db; }
.user-card .user-role.student { background:rgba(39,174,96,.15); color:#27ae60; }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="app-bar">
  <h1><a href="index.html">Rohans Web</a> · Admin</h1>
  <div class="user-info" id="userInfo"></div>
</div>

<div class="content">
  <div class="back-link"><a href="dashboard.html">← Back to Dashboard</a></div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Create Student -->
  <div class="section">
    <h2>Create Student</h2>
    <div class="error-msg" id="createError"></div>
    <div class="success-msg" id="createSuccess"></div>
    <form id="createForm">
      <div class="form-row">
        <div class="form-group"><label>Username</label><input type="text" id="newUsername" placeholder="Student username" required></div>
        <div class="form-group"><label>Password</label><input type="text" id="newPassword" placeholder="Password" required></div>
        <div class="form-group"><label>Class</label><input type="text" id="newClass" placeholder="e.g., 5A"></div>
      </div>
      <label style="font-weight:bold;color:#4a3206;font-size:.85rem;display:block;margin:12px 0 6px;">Enable Products</label>
      <div class="product-checks" id="createProductChecks"></div>
      <button type="submit" class="btn" style="margin-top:10px;">Create Student</button>
    </form>
  </div>

  <!-- Students -->
  <div class="section">
    <h2 id="studentsTitle">My Students</h2>
    <div class="filter-row">
      <input type="text" id="searchInput" placeholder="Search by name..." oninput="renderStudents()">
      <select id="classFilter" onchange="renderStudents()"><option value="">All Classes</option></select>
    </div>
    <div id="studentList"></div>
  </div>

  <!-- Super Admin: Create Admin -->
  <div class="section" id="adminSection" style="display:none;">
    <h2>Create Admin</h2>
    <div class="error-msg" id="adminError"></div>
    <div class="success-msg" id="adminSuccess"></div>
    <form id="adminForm">
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" id="adminEmail" placeholder="admin@email.com" required></div>
        <div class="form-group"><label>Password</label><input type="text" id="adminPassword" placeholder="Password" required></div>
      </div>
      <button type="submit" class="btn" style="margin-top:10px;">Create Admin</button>
    </form>
  </div>

  <!-- Super Admin: All Users -->
  <div class="section" id="allUsersSection" style="display:none;">
    <h2>All Users</h2>
    <p style="color:#7a5c1a;font-size:.85rem;margin-bottom:14px;">Manage admins and regular users — change passwords, promote/demote, or delete.</p>
    <div id="allUsersList"></div>
  </div>

  <!-- Super Admin: Website Editor -->
  <div class="section" id="websiteEditorSection" style="display:none;">
    <h2>Website Editor</h2>
    <p style="color:#7a5c1a;margin-bottom:12px;font-size:.9rem;">Edit the HTML pages of your website directly.</p>
    <a href="website-editor.html" class="btn">Edit Website →</a>
  </div>
</div>

<!-- Edit Student Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Student</h2>
    <div class="error-msg" id="editError"></div>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="form-group"><label>New Password (leave blank to keep)</label><input type="text" id="editPassword" placeholder="New password"></div>
      <div class="form-group"><label>Class</label><input type="text" id="editClass" placeholder="e.g., 5A"></div>
      <label style="font-weight:bold;color:#4a3206;font-size:.85rem;display:block;margin:12px 0 6px;">Products</label>
      <div class="product-checks" id="editProductChecks"></div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button type="submit" class="btn">Save Changes</button>
        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
if (!API.requireAuth()) throw new Error('redirect');
const user = API.getUser();
if (!API.requireRole('admin', 'super_admin')) throw new Error('redirect');
const isSuperAdmin = user.role === 'super_admin';

document.getElementById('userInfo').innerHTML =
  `<span class="role-badge">${user.role.replace('_',' ')}</span>
   <button class="logout-btn" onclick="API.logout()">Logout</button>`;

if (isSuperAdmin) {
  document.getElementById('adminSection').style.display = 'block';
  document.getElementById('allUsersSection').style.display = 'block';
  document.getElementById('websiteEditorSection').style.display = 'block';
  document.getElementById('studentsTitle').textContent = 'All Students';
}

let productDefs = [];
let allUsers = [];
let allStudents = [];

async function loadProducts() {
  productDefs = await API.call('/api/products');
  renderChecks('createProductChecks', []);
}

function renderChecks(containerId, selected) {
  document.getElementById(containerId).innerHTML = productDefs.map(p =>
    `<label><input type="checkbox" value="${p.slug}" ${selected.includes(p.slug)?'checked':''}> ${p.name}</label>`
  ).join('');
}
function getChecks(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input:checked`)).map(cb => cb.value);
}

// Stats
async function loadStats() {
  try {
    const s = await API.call('/api/admin/stats');
    const cards = [
      { num: s.students, label: 'Students' },
      { num: s.admins, label: 'Admins' },
      { num: s.users, label: 'Users' },
      { num: s.productCounts['coding'] || 0, label: 'Coding' },
      { num: s.productCounts['builder'] || 0, label: 'Builder' },
      { num: s.productCounts['coding-kids'] || 0, label: 'Kids Code' }
    ];
    document.getElementById('statsGrid').innerHTML = cards.map(c =>
      `<div class="stat-card"><span class="stat-num">${c.num}</span><span class="stat-label">${c.label}</span></div>`
    ).join('');
  } catch {}
}

// Create student
document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('createError'), succ = document.getElementById('createSuccess');
  err.classList.remove('show'); succ.classList.remove('show');
  try {
    await API.call('/api/admin/create-student', { method: 'POST', body: {
      username: document.getElementById('newUsername').value.trim(),
      password: document.getElementById('newPassword').value,
      className: document.getElementById('newClass').value.trim() || null,
      products: getChecks('createProductChecks')
    }});
    succ.textContent = 'Student created!'; succ.classList.add('show');
    e.target.reset(); renderChecks('createProductChecks', []); loadData();
  } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
});

// Create admin
if (isSuperAdmin) {
  document.getElementById('adminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('adminError'), succ = document.getElementById('adminSuccess');
    err.classList.remove('show'); succ.classList.remove('show');
    try {
      await API.call('/api/superadmin/create-admin', { method: 'POST', body: {
        email: document.getElementById('adminEmail').value.trim(),
        password: document.getElementById('adminPassword').value
      }});
      succ.textContent = 'Admin created!'; succ.classList.add('show');
      e.target.reset(); loadData();
    } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
  });
}

// Load all data
async function loadData() {
  try {
    allUsers = await API.call('/api/admin/users');
    allStudents = allUsers.filter(u => u.role === 'student');

    // Populate class filter
    const classes = [...new Set(allStudents.map(s => s.class).filter(Boolean))].sort();
    const classFilter = document.getElementById('classFilter');
    classFilter.innerHTML = '<option value="">All Classes</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

    renderStudents();
    if (isSuperAdmin) renderAllUsers();
    loadStats();
  } catch (ex) {
    document.getElementById('studentList').innerHTML = `<p style="color:#c0392b;">${ex.message}</p>`;
  }
}

// Render students with search/filter
function renderStudents() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const classFilter = document.getElementById('classFilter').value;
  const filtered = allStudents.filter(s => {
    const name = (s.username || '').toLowerCase();
    const matchSearch = !search || name.includes(search);
    const matchClass = !classFilter || s.class === classFilter;
    return matchSearch && matchClass;
  });

  if (!filtered.length) {
    document.getElementById('studentList').innerHTML = '<p style="color:#7a5c1a;">No students found.</p>';
    return;
  }

  document.getElementById('studentList').innerHTML = filtered.map(s => {
    const badges = productDefs.map(p => {
      const on = (s.products || []).includes(p.slug);
      return `<span class="prod-badge ${on?'on':'off'}" onclick="toggleProduct(${s.id},'${p.slug}',${on})">${p.name}</span>`;
    }).join('');
    return `<div class="student-card">
      <div class="student-card-header">
        <div><div class="student-name">${s.username}</div><div class="student-meta">Class: ${s.class||'Not set'}</div></div>
      </div>
      <div class="student-products">${badges}</div>
      <div class="student-actions">
        <button class="mini-btn" onclick="quickPassword(${s.id},'${s.username}')">Reset Password</button>
        <button class="mini-btn" onclick="editStudent(${s.id})">Edit</button>
        <button class="mini-btn danger" onclick="deleteUser(${s.id},'${s.username}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// Quick product toggle
async function toggleProduct(studentId, slug, currentlyOn) {
  const student = allStudents.find(s => s.id === studentId);
  if (!student) return;
  const products = student.products || [];
  const newProducts = currentlyOn ? products.filter(p => p !== slug) : [...products, slug];
  try {
    await API.call(`/api/admin/student/${studentId}`, { method: 'PUT', body: { products: newProducts } });
    student.products = newProducts;
    renderStudents(); loadStats();
  } catch (ex) { alert(ex.message); }
}

// Quick password reset
async function quickPassword(id, name) {
  const pw = prompt(`New password for ${name}:`);
  if (!pw) return;
  try {
    await API.call(`/api/admin/student/${id}`, { method: 'PUT', body: { password: pw } });
    alert('Password updated!');
  } catch (ex) { alert(ex.message); }
}

// All users (super admin)
function renderAllUsers() {
  const nonStudents = allUsers.filter(u => u.role !== 'student');
  if (!nonStudents.length) {
    document.getElementById('allUsersList').innerHTML = '<p style="color:#7a5c1a;">No other users.</p>';
    return;
  }
  document.getElementById('allUsersList').innerHTML = nonStudents.map(u => {
    const name = u.email || u.username;
    return `<div class="user-card">
      <div><span class="user-name">${name}</span> <span class="user-role ${u.role}">${u.role}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="mini-btn" onclick="changeUserPassword(${u.id},'${name}')">Change Password</button>
        ${u.role === 'admin' ? `<button class="mini-btn" onclick="changeRole(${u.id},'user')">Demote to User</button>` : ''}
        ${u.role === 'user' ? `<button class="mini-btn" onclick="changeRole(${u.id},'admin')">Promote to Admin</button>` : ''}
        <button class="mini-btn danger" onclick="deleteUser(${u.id},'${name}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function changeUserPassword(id, name) {
  const pw = prompt(`New password for ${name}:`);
  if (!pw) return;
  try {
    await API.call(`/api/superadmin/user/${id}`, { method: 'PUT', body: { password: pw } });
    alert('Password updated!');
  } catch (ex) { alert(ex.message); }
}

async function changeRole(id, role) {
  if (!confirm(`Change this user's role to ${role}?`)) return;
  try {
    await API.call(`/api/superadmin/user/${id}`, { method: 'PUT', body: { role } });
    loadData();
  } catch (ex) { alert(ex.message); }
}

// Edit student modal
let editingId = null;
async function editStudent(id) {
  const s = allStudents.find(u => u.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('editPassword').value = '';
  document.getElementById('editClass').value = s.class || '';
  renderChecks('editProductChecks', s.products || []);
  document.getElementById('editError').classList.remove('show');
  document.getElementById('editModal').classList.add('show');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('show'); editingId = null; }

document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('editError'); err.classList.remove('show');
  try {
    const body = { className: document.getElementById('editClass').value.trim() || null, products: getChecks('editProductChecks') };
    const pw = document.getElementById('editPassword').value;
    if (pw) body.password = pw;
    await API.call(`/api/admin/student/${editingId}`, { method: 'PUT', body });
    closeEditModal(); loadData();
  } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
});

// Delete
async function deleteUser(id, name) {
  if (!confirm(`Delete ${name}?`)) return;
  try { await API.call(`/api/admin/user/${id}`, { method: 'DELETE' }); loadData(); }
  catch (ex) { alert(ex.message); }
}

// Init
loadProducts().then(loadData);
</script>
</body>
</html>
