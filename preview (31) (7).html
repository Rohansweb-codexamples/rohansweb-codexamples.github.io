<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Library</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0e1117;
color:white;
}

header{
padding:50px 25px;
background:
linear-gradient(
135deg,
#ffd54a,
#ff8c00,
#ff4d4d,
#ff4fa3
);
}

header h1{
font-size:3rem;
}

.search{
padding:25px;
background:#161b22;
position:sticky;
top:0;
z-index:10;
}

input{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(350px,1fr));
gap:20px;
padding:25px;
}

.card{
background:#161b22;
border-radius:20px;
overflow:hidden;
box-shadow:
0 10px 25px rgba(0,0,0,.4);
}

.card h2{
padding:20px;
background:#202938;
}

pre{
padding:20px;
overflow:auto;
color:#8be9fd;
}

.copy{
margin:20px;
padding:12px 18px;
border:none;
border-radius:12px;
background:#ff8c00;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Code Library</h1>
<p>Free snippets, animations and components.</p>
</header>

<div class="search">
<input
id="search"
placeholder="Search snippets...">
</div>

<div
class="grid"
id="snippets">
</div>

<script src="snippets.js"></script>

<script>

const search =
document.getElementById("search");

search.addEventListener(
"input",
()=>{
const value=
search.value.toLowerCase();

document
.querySelectorAll(".card")
.forEach(card=>{

card.style.display=
card.innerText
.toLowerCase()
.includes(value)
? "block"
: "none";

});
});

</script>

</body>
</html>
