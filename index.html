<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohans Web</title>

<link rel="icon" href="https://rohansweb-codexamples.github.io/download%20(3).png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#ffd54a,#ff8c00,#ff4d4d,#ff4fa3);
background-size:400% 400%;
animation:gradient 15s ease infinite;
color:white;
overflow-x:hidden;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:-1;
}

nav{
position:fixed;
top:0;
width:100%;
padding:15px;
display:flex;
justify-content:center;
gap:15px;
backdrop-filter:blur(20px);
background:rgba(0,0,0,.25);
z-index:100;
}

nav a{
color:white;
text-decoration:none;
padding:10px 18px;
border-radius:12px;
background:rgba(255,255,255,.1);
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero img{
width:150px;
border-radius:30px;
box-shadow:0 0 30px rgba(255,255,255,.3);
}

.hero h1{
font-size:5rem;
margin:20px 0;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.btn{
padding:15px 25px;
background:white;
color:#ff6600;
border-radius:14px;
font-weight:bold;
text-decoration:none;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:50px;
}

.card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
border-radius:20px;
padding:25px;
}

footer{
padding:40px;
text-align:center;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="https://projects.rohansweb.co.uk/download%20(3).mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<nav>
<a href="index.html">Home</a>
<a href="projects.html">Projects</a>
<a href="code-library.html">Code Library</a>
<a href="https://gamehub.rohansweb.co.uk">Game Hub</a>
<a href="https://beamdrop-gidy.onrender.com">BeamDrop</a>
</nav>

<section class="hero">

<img src="https://rohansweb-codexamples.github.io/download%20(3).png">

<h1>Rohans Web</h1>

<div class="buttons">
<a class="btn" href="https://projects.rohansweb.co.uk">Projects</a>
<a class="btn" href="https://gamehub.rohansweb.co.uk">Game Hub</a>
<a class="btn" href="https://beamdrop-gidy.onrender.com">BeamDrop</a>
<a class="btn" href="code-library.html">Code Library</a>
</div>

</section>

<section class="cards">

<div class="card">
<h2>Projects</h2>
<p>Explore all Rohans Web projects.</p>
</div>

<div class="card">
<h2>Game Hub</h2>
<p>Play games and discover new releases.</p>
</div>

<div class="card">
<h2>BeamDrop</h2>
<p>Store and share files online.</p>
</div>

</section>

<footer>
© Rohans Web
</footer>

</body>
</html>
